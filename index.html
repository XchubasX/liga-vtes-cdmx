<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liga VTES CDMX</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #121212; color: #e0e0e0; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { color: #d32f2f; text-align: center; border-bottom: 2px solid #d32f2f; padding-bottom: 10px; }
    .card { background: #1e1e1e; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    h2 { margin-top: 0; color: #ef5350; font-size: 1.2rem; }
    input[type="text"] { width: calc(100% - 22px); padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 1rem; }
    button { width: 100%; padding: 12px; background: #b71c1c; color: white; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; margin-top: 5px; }
    button:hover { background: #e53935; }
    ul { list-style: none; padding: 0; }
    li { background: #2a2a2a; margin-bottom: 8px; padding: 10px 15px; border-radius: 4px; display: flex; align-items: center; justify-content: space-between; }
    .checkbox-label { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    input[type="checkbox"] { transform: scale(1.3); cursor: pointer; }
    .table-box { background: #2a1515; border-left: 4px solid #d32f2f; padding: 12px; margin-top: 10px; border-radius: 0 4px 4px 0; }
    .status-badge { font-size: 0.85rem; padding: 3px 8px; border-radius: 12px; }
    .present { background: #1b5e20; color: #a5d6a7; }
    .absent { background: #424242; color: #bdbdbd; }
    ol { margin: 5px 0 0 20px; padding: 0; }
    li.seat-item { background: transparent; padding: 2px 0; display: list-item; }
  </style>

  <!-- Librerías de Firebase en modo Compatibilidad -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="container">
    <h1>🩸 Liga VTES México / CDMX</h1>

    <!-- 1. Registro -->
    <div class="card">
      <h2>1. Registro de Jugador</h2>
      <input type="text" id="playerName" placeholder="Tu Nombre o Nick de Archon">
      <button onclick="registerPlayer()">Anotarme a la Fecha</button>
    </div>

    <!-- 2. Lista de Confirmados -->
    <div class="card">
      <h2>2. Lista de Inscritos y Pase de Lista</h2>
      <p style="font-size: 0.85rem; color: #aaa;">Marca la casilla cuando el jugador LLEGUE FÍSICAMENTE al venue.</p>
      <ul id="playerList"></ul>
    </div>

    <!-- 3. Sorteo -->
    <div class="card">
      <h2>3. Control del Organizador</h2>
      <button onclick="generateTables()" style="background: #2e7d32;">🎲 Sortear Mesas (Solo Presentes)</button>
    </div>

    <!-- 4. Resultados -->
    <div class="card">
      <h2>4. Mesas y Orden de Turno (Seating)</h2>
      <div id="tablesOutput"><em>Las mesas aparecerán aquí cuando el organizador realice el sorteo.</em></div>
    </div>
  </div>

  <script>
    // Configuración de tu proyecto liga-vtes-mexico
    const firebaseConfig = {
      apiKey: "AIzaSyDPvUBI7JuIMS5Pt_MMMhQ0qzsuYf3WmPo",
      authDomain: "liga-vtes-mexico.firebaseapp.com",
      databaseURL: "https://liga-vtes-mexico-default-rtdb.firebaseio.com",
      projectId: "liga-vtes-mexico",
      storageBucket: "liga-vtes-mexico.firebasestorage.app",
      messagingSenderId: "953764362226",
      appId: "1:953764362226:web:d76f68f5a017b29ad31d6b"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Escuchar cambios en tiempo real en la lista de jugadores
    db.ref('liga_players').on('value', (snapshot) => {
      const list = document.getElementById('playerList');
      list.innerHTML = '';
      const data = snapshot.val() || {};
      
      Object.keys(data).forEach(id => {
        const player = data[id];
        const li = document.createElement('li');
        
        li.innerHTML = `
          <label class="checkbox-label">
            <input type="checkbox" ${player.present ? 'checked' : ''} onchange="togglePresence('${id}', this.checked)">
            <strong>${player.name}</strong>
          </label>
          <span class="status-badge ${player.present ? 'present' : 'absent'}">
            ${player.present ? 'En venue' : 'Ausente'}
          </span>
        `;
        list.appendChild(li);
      });
    });

    // Registrar un nuevo jugador
    function registerPlayer() {
      const input = document.getElementById('playerName');
      const name = input.value.trim();
      if (!name) return alert('Por favor ingresa un nombre.');

      const newRef = db.ref('liga_players').push();
      newRef.set({
        name: name,
        present: false
      });
      input.value = '';
    }

    // Alternar la casilla de "En venue"
    function togglePresence(id, isPresent) {
      db.ref('liga_players/' + id).update({
        present: isPresent
      });
    }

    // Mezcla aleatoria (Algoritmo Fisher-Yates)
    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // Generar las mesas con los jugadores presentes
    function generateTables() {
      db.ref('liga_players').once('value').then(snapshot => {
        const data = snapshot.val() || {};
        let presentPlayers = [];
        
        Object.keys(data).forEach(id => {
          if (data[id].present) {
            presentPlayers.push(data[id].name);
          }
        });

        const total = presentPlayers.length;
        if (total < 4) {
          return alert('Se necesitan al menos 4 jugadores presentes en el venue para armar mesas.');
        }

        // Mezclar aleatoriamente el orden de los jugadores presentes
        presentPlayers = shuffle(presentPlayers);

        // Desglose de mesas oficiales (prioriza mesas de 5 y luego mesas de 4)
        let numFives = 0;
        let numFours = 0;

        for (let f = Math.floor(total / 5); f >= 0; f--) {
          let rem = total - (f * 5);
          if (rem % 4 === 0) {
            numFives = f;
            numFours = rem / 4;
            break;
          }
        }

        if (numFives === 0 && numFours === 0) {
          return alert(`No se puede dividir equitativamente a ${total} jugadores únicamente en mesas de 4 y 5.`);
        }

        let tables = [];
        let idx = 0;

        for (let i = 0; i < numFives; i++) {
          tables.push(presentPlayers.slice(idx, idx + 5));
          idx += 5;
        }
        for (let i = 0; i < numFours; i++) {
          tables.push(presentPlayers.slice(idx, idx + 4));
          idx += 4;
        }

        // Mostrar el resultado del seating en la interfaz
        const output = document.getElementById('tablesOutput');
        output.innerHTML = '';

        tables.forEach((table, tableIndex) => {
          const box = document.createElement('div');
          box.className = 'table-box';
          
          let html = `<strong>Mesa ${tableIndex + 1} (${table.length} Jugadores):</strong><ol>`;
          table.forEach((player) => {
            html += `<li class="seat-item">${player}</li>`;
          });
          html += `</ol>`;
          
          box.innerHTML = html;
          output.appendChild(box);
        });
      });
    }
  </script>
</body>
</html>
